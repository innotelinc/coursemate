name: ios-release

# The iOS build lives in its own repository, but its release credentials are
# here. A secret set on one repository is unreadable from another, so this job
# runs where the App Store Connect key already is and checks the app out beside
# it. The app's own release.yml stays the long-term home; this is the path that
# works today without copying a private key to a second repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version for the build
        required: false
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15

    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out the server
        uses: actions/checkout@v4

      # Public, so the default token can read it; no second PAT to rotate.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: innotelinc/coursemate-ios
          path: ios

      - name: Preflight
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY:-}" ]       || missing+=("APP_STORE_CONNECT_KEY (the .p8 contents, PEM or base64)")
          [ -n "${ASC_KEY_ID:-}" ]    || missing+=("APP_STORE_CONNECT_KEY_ID (10 chars)")
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID (UUID)")
          [ -n "${TEAM_ID:-}" ]       || missing+=("APPLE_TEAM_ID (10 chars)")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release credentials are incomplete; nothing was built or uploaded."
            for m in "${missing[@]}"; do echo "::error::missing secret: $m"; done
            exit 1
          fi

      # xcodebuild wants a path, altool looks in a fixed directory, and neither
      # accepts one the other writes — so the key goes to both.
      - name: Install App Store Connect key
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEY_DIR"
          if printf '%s' "$ASC_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY" > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          else
            printf '%s' "$ASC_KEY" | tr -d '\n' | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          fi
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          openssl pkey -in "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" -noout >/dev/null
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" "$HOME/.appstoreconnect/private_keys/"
          echo "KEY_PATH=$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Project matches its generator
        working-directory: ios
        run: |
          python3 tools/gen-project.py
          if ! git diff --quiet -- CourseMate.xcodeproj; then
            echo "::error::CourseMate.xcodeproj is out of date in the app repository."
            exit 1
          fi

      - name: Version
        run: |
          set -euo pipefail
          echo "MARKETING_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # App Store Connect refuses anything below the iOS 26 SDK, and the image
      # default is Xcode 16.4. Every Xcode on the box is listed first, so a run
      # that stops here says what this image actually carries.
      # App Store Connect refuses anything below the iOS 26 SDK and the image
      # default is 16.4. The Xcode is chosen by directory name, not by running
      # each one's xcodebuild: probing a toolchain whose developer dir is not
      # selected aborts (exit 134), which fails the step for no useful reason.
      - name: Select the newest Xcode
        run: |
          set -uo pipefail
          newest=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            name=${app##*/}; ver=${name#Xcode_}; ver=${ver%.app}
            printf '%s\n' "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || continue
            printf '%s %s\n' "$ver" "$app"
          done | sort -V > "$RUNNER_TEMP/xcodes.txt"
          cat "$RUNNER_TEMP/xcodes.txt"
          newest=$(tail -n 1 "$RUNNER_TEMP/xcodes.txt")
          if [ -z "$newest" ]; then
            echo "::error::No versioned Xcode found on this image."
            exit 1
          fi
          bestv=${newest%% *}
          best=${newest#* }
          if [ "${bestv%%.*}" -lt 26 ]; then
            echo "::error::Newest Xcode is $bestv; App Store Connect requires 26 or newer (iOS 26 SDK)."
            exit 1
          fi
          sudo xcode-select -s "$best"
          echo "selected: $best"
          xcodebuild -version

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CourseMate.xcodeproj \
            -scheme CourseMate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CourseMate.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tail -n 250

      - name: Export IPA
        working-directory: ios
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CourseMate.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tail -n 250
          ls -1 "$RUNNER_TEMP/export"

      # A green step here means Apple accepted the upload. Processing is
      # asynchronous, so the build appears in TestFlight minutes later.
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursemate-ipa-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
          retention-days: 14
