name: ios-release

# The iOS build lives in its own repository, but its release credentials are
# here. A secret set on one repository is unreadable from another, so this job
# runs where the App Store Connect key already is and checks the app out beside
# it. The app's own release.yml stays the long-term home; this is the path that
# works today without copying a private key to a second repository.
on:
  # A tag in the app repository is the release trigger. Its own release.yml
  # cannot sign anything — the App Store Connect key and the distribution
  # identity live here — so this looks for tags that have not been built yet and
  # releases the newest one. Twenty minutes is short enough that a tag still
  # feels like a trigger, and long enough that polling costs nothing.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version for the build
        required: false
        default: "1.0"

permissions:
  # Write, for one thing only: the ios-release/<tag> marker that keeps the
  # schedule from building the same tag twice.
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  # What to release, and whether there is anything to release at all. Linux,
  # because it only reads tags: the app repository is public, so seeing them
  # needs no token, and no credential is touched.
  pick:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest unreleased tag
        id: pick
        run: |
          set -euo pipefail
          APP=innotelinc/coursemate-ios

          # A dispatch says which version outright.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git ls-remote --tags --refs "https://github.com/$APP" \
            | awk '{print $2}' | sed 's#refs/tags/##' \
            | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1 || true)
          if [ -z "$latest" ]; then
            echo "no version tags in $APP — nothing to release"
            exit 0
          fi

          # ios-release/<tag> lives here, beside the credentials, so the poll can
          # tell a tag it has already built from one pushed a minute ago.
          released=$(git ls-remote --tags --refs origin 'refs/tags/ios-release/*' \
            | awk '{print $2}' | sed 's#refs/tags/ios-release/##' || true)
          if printf '%s\n' "$released" | grep -qx "${latest#v}"; then
            echo "$latest is already released"
            exit 0
          fi

          echo "releasing $latest"
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"

  release:
    needs: pick
    # Empty when there is nothing new: the macOS job does not start at all.
    if: needs.pick.outputs.version != ''
    runs-on: macos-15

    env:
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # One distribution identity, reused forever. Without it, automatic signing
      # mints a certificate on every ephemeral runner — because the private key
      # dies with the runner — until the account hits Apple's certificate limit
      # and every release after that fails to sign.
      SIGNING_P12: ${{ secrets.SIGNING_P12 }}
      SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
      # Where the app looks for the server, and the bearer it presents. The URL
      # is public; the token is a repository secret and only ever reaches the
      # bundle that is about to be signed.
      CM_SERVER: https://cm.innotel.us
      CM_TOKEN: ${{ secrets.COURSEMATE_TOKEN }}

    steps:
      - name: Check out the server
        uses: actions/checkout@v4

      # Public, so the default token can read it; no second PAT to rotate.
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          repository: innotelinc/coursemate-ios
          path: ios

      - name: Preflight
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ASC_KEY:-}" ]       || missing+=("APP_STORE_CONNECT_KEY (the .p8 contents, PEM or base64)")
          [ -n "${ASC_KEY_ID:-}" ]    || missing+=("APP_STORE_CONNECT_KEY_ID (10 chars)")
          [ -n "${ASC_ISSUER_ID:-}" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID (UUID)")
          [ -n "${TEAM_ID:-}" ]       || missing+=("APPLE_TEAM_ID (10 chars)")
          # Required, not optional. Automatic signing on an ephemeral runner
          # mints a certificate whenever no identity is present — the private key
          # dies with the runner, so every run adds one until Apple refuses and
          # the release fails with "maximum number of certificates". A fork, or
          # this repository with a cleared secret, must say that plainly instead
          # of quietly spending the account's certificate budget.
          [ -n "${SIGNING_P12:-}" ]   || missing+=("SIGNING_P12 (base64 of the distribution identity's .p12)")
          [ -n "${SIGNING_P12_PASSWORD:-}" ] || missing+=("SIGNING_P12_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Release credentials are incomplete; nothing was built or uploaded."
            for m in "${missing[@]}"; do echo "::error::missing secret: $m"; done
            exit 1
          fi

      # xcodebuild wants a path, altool looks in a fixed directory, and neither
      # accepts one the other writes — so the key goes to both.
      - name: Install App Store Connect key
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/asc"
          KEY_FILE="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          if printf '%s' "$ASC_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY" > "$KEY_FILE"
          else
            printf '%s' "$ASC_KEY" | tr -d '\n' | base64 --decode > "$KEY_FILE" 2>/dev/null || : > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          # Validate before a single thing is built, and say what to do about it.
          # The raw openssl complaint ("Expecting: ANY PRIVATE KEY") names neither
          # the secret nor the fix, and it cost a whole release to interpret. The
          # length and line count are reported because they separate "wrong file"
          # from "truncated paste" without printing the secret.
          if ! openssl pkey -in "$KEY_FILE" -noout >/dev/null 2>"$RUNNER_TEMP/openssl.err"; then
            echo "::error::APP_STORE_CONNECT_KEY is not a private key (${#ASC_KEY} bytes, $(wc -l < "$KEY_FILE" | tr -d ' ') line(s))."
            echo "::error::Re-download AuthKey_${ASC_KEY_ID}.p8 from App Store Connect > Users and Access > Integrations."
            echo "::error::Then: gh secret set APP_STORE_CONNECT_KEY --repo ${{ github.repository }} < AuthKey_${ASC_KEY_ID}.p8"
            sed 's/^/    openssl: /' "$RUNNER_TEMP/openssl.err" || true
            exit 1
          fi

          # App Store Connect keys are EC P-256. A key that parses but is another
          # kind will be refused at upload with a 401 that reads like a bad ID.
          if ! openssl pkey -in "$KEY_FILE" -noout -text 2>/dev/null | grep -qi 'prime256v1\|NIST CURVE: P-256'; then
            echo "::warning::APP_STORE_CONNECT_KEY is not an EC P-256 key; App Store Connect keys are, so the upload may be refused."
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          cp "$KEY_FILE" "$HOME/.appstoreconnect/private_keys/"
          echo "KEY_PATH=$KEY_FILE" >> "$GITHUB_ENV"

      # Before anything is built: does Apple actually accept this credential set?
      # Answering it here is the difference between "401 at upload" twenty minutes
      # later and a named secret. The key parses in both cases — an APNs key is a
      # valid ES256 .p8 too — so parsing proved nothing, and a swapped key id read
      # as a network error twice.
      - name: Apple accepts these credentials
        run: |
          node tools/asc.mjs probe \
            --key "$KEY_PATH" \
            --kid "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --bundle us.innotel.coursemate

      - name: Project matches its generator
        working-directory: ios
        run: |
          python3 tools/gen-project.py
          if ! git diff --quiet -- CourseMate.xcodeproj; then
            echo "::error::CourseMate.xcodeproj is out of date in the app repository."
            exit 1
          fi

      # A fresh install has to connect on its own, so the endpoint ships inside
      # the bundle rather than being typed into Settings. The token comes from
      # the secret and is written here, not committed: this repository is public.
      - name: Point the build at the server
        working-directory: ios
        run: |
          set -euo pipefail
          for plist in CourseMate/Info.plist CourseMateBroadcast/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :cm_url ${CM_SERVER}" "$plist"
          done
          if [ -n "${CM_TOKEN:-}" ]; then
            for plist in CourseMate/Info.plist CourseMateBroadcast/Info.plist; do
              /usr/libexec/PlistBuddy -c "Set :cm_token ${CM_TOKEN}" "$plist"
            done
            echo "endpoint ${CM_SERVER} with a bearer token"
          else
            echo "::warning::COURSEMATE_TOKEN is not set — this build needs the token entered once in Settings."
          fi
          /usr/libexec/PlistBuddy -c "Print :cm_url" CourseMate/Info.plist

      - name: Version
        run: |
          set -euo pipefail
          echo "MARKETING_VERSION=${{ needs.pick.outputs.version }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # App Store Connect refuses anything below the iOS 26 SDK, and the image
      # default is Xcode 16.4. Every Xcode on the box is listed first, so a run
      # that stops here says what this image actually carries.
      # App Store Connect refuses anything below the iOS 26 SDK and the image
      # default is 16.4. The Xcode is chosen by directory name, not by running
      # each one's xcodebuild: probing a toolchain whose developer dir is not
      # selected aborts (exit 134), which fails the step for no useful reason.
      - name: Select the newest Xcode
        run: |
          set -uo pipefail
          newest=""
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            name=${app##*/}; ver=${name#Xcode_}; ver=${ver%.app}
            printf '%s\n' "$ver" | grep -Eq '^[0-9]+(\.[0-9]+)*$' || continue
            printf '%s %s\n' "$ver" "$app"
          done | sort -V > "$RUNNER_TEMP/xcodes.txt"
          cat "$RUNNER_TEMP/xcodes.txt"
          newest=$(tail -n 1 "$RUNNER_TEMP/xcodes.txt")
          if [ -z "$newest" ]; then
            echo "::error::No versioned Xcode found on this image."
            exit 1
          fi
          bestv=${newest%% *}
          best=${newest#* }
          if [ "${bestv%%.*}" -lt 26 ]; then
            echo "::error::Newest Xcode is $bestv; App Store Connect requires 26 or newer (iOS 26 SDK)."
            exit 1
          fi
          sudo xcode-select -s "$best"
          echo "selected: $best"
          xcodebuild -version

      # A temporary keychain holding the one distribution identity. Xcode then
      # finds a usable certificate and signs with it, instead of asking Apple to
      # create another one.
      - name: Install the signing identity
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$PASSWORD"

          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"

          printf '%s' "$SIGNING_P12" | openssl base64 -d -A > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null

          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Fail here, naming the identity, rather than inside the archive.
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q 'Apple Distribution\|iPhone Distribution' \
            || { echo "::error::SIGNING_P12 does not contain a distribution identity."; exit 1; }

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          status=0
          xcodebuild archive \
            -project CourseMate.xcodeproj \
            -scheme CourseMate \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CourseMate.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 250 || status=$?

          # The one signing failure that is not a signing problem. Automatic
          # signing mints a certificate per ephemeral runner, because the private
          # key is gone with the previous one, so a long-lived account eventually
          # hits Apple's cap. Xcode reports that once per target and never says
          # what to do, which reads like a misconfiguration of this workflow.
          if [ "$status" -ne 0 ]; then
            if grep -q 'maximum number of certificates' "$RUNNER_TEMP/archive.log"; then
              echo "::error::Apple is at its distribution-certificate limit, so automatic signing cannot create another one. The code and the App Store Connect key are both fine."
              echo "::error::Fix: revoke an unused Apple Distribution certificate at developer.apple.com > Certificates, Identifiers & Profiles, then re-run this workflow."
              echo "::error::Revoking a certificate does not affect builds already uploaded to TestFlight."
              echo "::error::Durable fix: export one certificate and key as a .p12, store it as a secret, and have this job import it, so runs share an identity instead of creating certificates."
            fi
            exit "$status"
          fi

      - name: Export IPA
        working-directory: ios
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CourseMate.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tail -n 250
          ls -1 "$RUNNER_TEMP/export"

      # A green step here means Apple accepted the upload. Processing is
      # asynchronous, so the build appears in TestFlight minutes later.
      - name: Upload to TestFlight
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursemate-ipa-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/upload.log
          if-no-files-found: ignore
          retention-days: 14

      # The marker is what makes this idempotent: a tag that has one is not built
      # again on the next poll. Every path that releases writes it, not just the
      # schedule — a dispatch that skipped this looked finished and then rebuilt
      # the same tag on the next tick, once every ten minutes, forever.
      - name: Remember this tag was released
        if: success()
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "ios-release/${MARKETING_VERSION}"
          git push origin "refs/tags/ios-release/${MARKETING_VERSION}"
